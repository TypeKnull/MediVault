spring:
  application:
    name: MediVault
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/medivault}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-production-value}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

medivault:
  storage:
    upload-dir: ${MEDIVAULT_UPLOAD_DIR:uploads/reports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  external:
    cv-service-url: ${CV_SERVICE_URL:}
    ocr-space-api-url: ${OCR_SPACE_API_URL:https://api.ocr.space/parse/image}
    ocr-space-api-key: ${OCR_SPACE_API_KEY:}
    ai-api-url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    ai-api-key: ${AI_API_KEY:}
    ai-model: ${AI_MODEL:gemini-3.6-flash}
  firebase:
    credentials-path: ${FCM_CREDENTIALS_PATH:}
